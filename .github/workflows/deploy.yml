name: Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          command: deploy
          secrets: |
            LIGHTSPEED_CLIENT_ID
            LIGHTSPEED_CLIENT_SECRET
            AUTH_SECRET
        env:
          LIGHTSPEED_CLIENT_ID: ${{ secrets.LIGHTSPEED_CLIENT_ID }}
          LIGHTSPEED_CLIENT_SECRET: ${{ secrets.LIGHTSPEED_CLIENT_SECRET }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
