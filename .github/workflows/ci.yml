name: CI

on:
  pull_request:
  push:
    branches:
      - feature/**

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npx vite build
      - run: npx wrangler deploy --dry-run
